<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Service - Studio Lobna</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>Request Service</h1>
    <nav>
        <a href="{{ url_for('index', lang='en') }}">Home</a> |
        <a href="{{ url_for('works', lang='en') }}">Works</a> |
        <a href="{{ url_for('request_service', lang='en') }}">Request Service</a> |
        <a href="{{ url_for('pay', lang='en', request_id=1) }}">Pay</a>
    </nav>
    <div style="text-align:center; margin:10px 0;">
        <a href="{{ url_for('index', lang='ar') }}">العربية</a> |
        <a href="{{ url_for('index', lang='en') }}">English</a> |
        <a href="{{ url_for('index', lang='fr') }}">Français</a>
    </div>
</header>

<main>
    <h2>Service Request Form</h2>
    <form action="{{ url_for('request_service', lang='en') }}" method="POST">
        <label>Name:</label>
        <input type="text" name="name" required><br>
        <label>Email:</label>
        <input type="email" name="email" required><br>
        <label>Service Needed:</label>
        <textarea name="service" required></textarea><br>
        <button type="submit">Send Request</button>
    </form>
</main>

<footer>
    <p>© 2025 Studio Lobna</p>
</footer>
</body>
</html>
